[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamicsyntax"
dynamic = ["version"]
description = "DyLan, the Dynamic Syntax parser in Python"
readme = "README.md"
requires-python = ">=3.11"
# No blanket SPDX claim while the inherited licence mismatch remains unresolved.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "licenses/*.txt"]
authors = [{ name = "Arash Ashrafzadeh" }]
keywords = ["computational-linguistics", "computational-semantics", "semantic-parsing", "natural-language-processing", "parser", "ttr", "dialogue"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "certifi>=2024.2.2",
    "loguru>=0.7",
    "pyyaml>=6.0.3",
    "rich>=14.3.3",
    "textual>=8.2.8",
    "tqdm>=4.67",
]

[project.urls]
Homepage = "https://ds-workbench.vercel.app/"
Repository = "https://github.com/StergiosCha/DS_workbench"
Issues = "https://github.com/StergiosCha/DS_workbench/issues"
Upstream = "https://github.com/incrementaliser/DynamicSyntax"

[project.optional-dependencies]
hosting = ["fastapi==0.135.1", "uvicorn==0.41.0"]
gui = ["flet>=0.24.0"]
nlp = ["nltk>=3.9", "spacy>=3.8"]
viz = ["plotly>=5", "pandas>=2"]
video = ["manim>=0.20"]
rich = ["rich>=13"]

[dependency-groups]
dev = [
    "pytest>=8",
    "flet>=0.24.0",
    "ruff>=0.9",
    "rich>=13",
    "pytest-timeout>=2.4.0",
    "httpx>=0.28,<1",
]

[project.scripts]
dylan-gui = "dylan.gui.app:main"
dynamicsyntax-gui = "dylan.gui.app:main"
dylan-serve-web = "dylan.web_dev:main"
dynamicsyntax-serve-web = "dylan.web_dev:main"
ds-workbench = "dylan.workbench_server:main"
dsttr-induction = "dylan.induction.pipeline.cli:main"

[tool.setuptools_scm]

[tool.setuptools.package-data]
dynamicsyntax = ["grammars/**/*"]
"dynamicsyntax.resources" = ["**/*.txt", "**/__init__.py"]
"dynamicsyntax.workbench_assets" = ["*.html", "*.js", "*.css", "*.svg"]
"dynamicsyntax.workbench_data" = ["greek-lexicon/gdt-train.json", "greek-lexicon/README.md", "greek-clitics/corpus.jsonl", "coverage/paragraph-baseline.json", "coverage/open-text-results.json"]
"dylan.formula.latex" = ["*.sty", "*.txt"]

[tool.setuptools]
# Only explicit runtime assets enter wheels; research data remains in the source distribution.
include-package-data = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# ProcessPoolExecutor uses fork on Linux; pytest's threaded parent triggers this harmless warning.
filterwarnings = ["ignore::DeprecationWarning:multiprocessing.popen_fork"]

[tool.ruff]
line-length = 100
target-version = "py311"

# Skip uploading dist files that already exist on PyPI (avoids 400 file name reuse).
[tool.uv]
check-url = "https://pypi.org/simple"
